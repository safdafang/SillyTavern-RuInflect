<div class="ruinflect-person">
    <div class="ruinflect-row">
        <span class="ruinflect-name" data-role="name"></span>
        <label data-i18n="Gender">Gender</label>
        <select class="text_pole" data-role="gender">
            <option value="" data-i18n="not set">not set</option>
            <option value="m" data-i18n="masculine (he)">masculine (he)</option>
            <option value="f" data-i18n="feminine (she)">feminine (she)</option>
            <option value="n" data-i18n="neuter (it)">neuter (it)</option>
            <option value="pl" data-i18n="plural (they)">plural (they)</option>
        </select>
    </div>
    <small class="ruinflect-hint" data-role="note"></small>
    <div class="ruinflect-forms" data-role="forms"></div>
</div>
