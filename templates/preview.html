<div class="ruinflect-preview">
    <textarea id="ruinflect_preview_text" class="text_pole textarea_compact" rows="3"></textarea>
    <div class="ruinflect-row">
        <label for="ruinflect_preview_gender" data-i18n="As for a player who is">As for a player who is</label>
        <select id="ruinflect_preview_gender" class="text_pole">
            <option value="" data-i18n="as set in the persona">as set in the persona</option>
            <option value="m" data-i18n="masculine (he)">masculine (he)</option>
            <option value="f" data-i18n="feminine (she)">feminine (she)</option>
            <option value="n" data-i18n="neuter (it)">neuter (it)</option>
            <option value="pl" data-i18n="plural (they)">plural (they)</option>
        </select>
    </div>
    <div id="ruinflect_preview_out" class="ruinflect-out"></div>
</div>
